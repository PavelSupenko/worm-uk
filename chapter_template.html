<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worm українською</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,400;0,700;1,400&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="js/boot.js"></script>
    <script type="module" src="js/reader.js"></script>
</head>
<body>
    <header class="topbar" id="topbar">
        <button class="icon-button" id="open-toc" aria-label="Зміст">
            <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#menu"></use></svg>
        </button>
        <span class="topbar-title" id="topbar-title"></span>
        <button class="icon-button" id="open-settings" aria-label="Налаштування">
            <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#sliders"></use></svg>
        </button>
    </header>

    <main class="reader">
        <header class="chapter-head">
            <p class="chapter-kicker" id="chapter-kicker"></p>
            <h1 class="chapter-title" id="chapter-title">Завантаження…</h1>
            <p class="notice notice--draft" id="chapter-draft" hidden>Чернетка: текст ще не відредаговано, можливі помилки.</p>
            <nav class="chapter-nav chapter-nav--top" id="nav-top" aria-label="Сусідні глави"></nav>
        </header>
        <section class="audio" id="audio" aria-label="Озвучка"></section>
        <article class="chapter-text" id="chapter-text">
            <p class="loading">Завантаження тексту…</p>
        </article>
        <nav class="chapter-nav chapter-nav--bottom" id="nav-bottom" aria-label="Сусідні глави"></nav>
    </main>

    <dialog class="drawer drawer--left" id="toc-dialog" aria-label="Зміст">
        <div class="drawer-body">
            <div class="drawer-head">
                <a class="drawer-home" href="index.html">
                    <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#home"></use></svg>
                    На головну
                </a>
                <button class="icon-button" data-close aria-label="Закрити">
                    <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#close"></use></svg>
                </button>
            </div>
            <nav class="toc" id="toc-container" aria-label="Зміст"></nav>
        </div>
    </dialog>
</body>
</html>
